                                  # DO TRUOC KHI LAT sang strict (2026-08-03), khong lat mu:
                                  #   217 file .md trong llmwiki/wiki, 2 file co khoi evidence-chain,
                                  #   2/2 bi bat — ca hai la tai lieu DAY chinh dinh dang nay, ref vi du
                                  #   co y khong ton tai. Mot LOP bao oan, khong phai hai ca le, nen sua
                                  #   bang ngoai le `r19_meta: true` (cung khuon r7_meta) -> bao oan 0/2.

